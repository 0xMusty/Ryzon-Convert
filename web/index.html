<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RYZON Crypto to Naira off-ramp mobile application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ryzon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ryzon</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Prevent WASM compilation failure from breaking web preview
    window.addEventListener('unhandledrejection', function(event) {
      if (event.reason && (
        String(event.reason).includes('WebAssembly') || 
        String(event.reason).includes('Response body loading was aborted') ||
        String(event.reason).includes('compilation aborted')
      )) {
        console.warn('WebAssembly loading aborted; falling back to JS renderer:', event.reason);
        event.preventDefault();
      }
    });

    // Configure Flutter web loader fallback options
    window._flutter = window._flutter || {};
    window._flutter.buildConfig = window._flutter.buildConfig || {
      builds: [
        { compileTarget: 'dart2js', renderer: 'canvaskit' },
        { compileTarget: 'dart2js', renderer: 'html' }
      ]
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
